<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yearbook Class - Painted Memories</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Hero Banner -->
  <header class="hero">
    <div class="hero-content">
      <h1>Painted Memories</h1>
      <p>Kenangan Indah Kelas Sofia, Latvia, & Madrid</p>
    </div>
  </header>

  <!-- Container Utama -->
  <main class="container">
    
    <!-- Tab Pemilih Kelas -->
    <div class="class-tabs">
      <button class="tab-btn active" onclick="switchClass('sofia', this)">Kelas Sofia</button>
      <button class="tab-btn" onclick="switchClass('latvia', this)">Kelas Latvia</button>
      <button class="tab-btn" onclick="switchClass('madrid', this)">Kelas Madrid</button>
    </div>

    <!-- Bagian 1: Daftar Anggota Kelas -->
    <section class="section-container">
      <h2 class="section-title">Anggota Kelas</h2>
      <div class="members-grid" id="members-grid">
        <!-- Kartu anggota akan diisi otomatis lewat JS -->
      </div>
    </section>

    <!-- Bagian 2: Galeri Carousel Foto -->
    <section class="section-container">
      <h2 class="section-title">Galeri Kenangan</h2>
      <div class="carousel-wrapper">
        <button class="nav-btn left-btn" onclick="scrollGallery(-1)">&#10094;</button>
        <div class="gallery-carousel" id="gallery-carousel">
          <!-- Foto galeri akan diisi otomatis lewat JS -->
        </div>
        <button class="nav-btn right-btn" onclick="scrollGallery(1)">&#10095;</button>
      </div>
    </section>

  </main>

  <!-- POPUP 1: Lightbox Galeri Foto -->
  <div id="lightbox" class="modal" onclick="closeModal('lightbox')">
    <span class="close-btn">&times;</span>
    <img class="modal-img" id="lightbox-img" src="" alt="Gallery Detail">
    <div id="lightbox-caption" class="modal-caption"></div>
  </div>

  <!-- POPUP 2: Modal Detail Profil Anggota -->
  <div id="profile-modal" class="modal" onclick="checkCloseProfile(event)">
    <div class="modal-card">
      <span class="close-btn" onclick="closeModal('profile-modal')">&times;</span>
      <img id="profile-modal-img" src="" alt="Profile Image" class="profile-avatar">
      <h3 id="profile-modal-name">Nama Anggota</h3>
      <p id="profile-modal-role" class="profile-role">Jabatan</p>
      <p id="profile-modal-quote" class="profile-quote">"Pesan atau quotes..."</p>
      <a id="profile-modal-ig" href="#" target="_blank" class="profile-ig-btn">Instagram</a>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Yearbook Class - Painted Memories</p>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
